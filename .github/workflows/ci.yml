name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for headless checks
        run: pnpm --filter @staticforge/checker exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test the CLI
        run: |
          pnpm sforge --version
          pnpm sforge schema config --json > /dev/null
          pnpm sforge init "$RUNNER_TEMP/site" --format json
          pnpm sforge build --cwd "$RUNNER_TEMP/site"
          pnpm sforge build --cwd examples/basic-site
          pnpm sforge check --cwd "$RUNNER_TEMP/site"
          pnpm sforge check --cwd examples/basic-site --format sarif --output "$RUNNER_TEMP/check.sarif"
