name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for headless checks
        run: pnpm --filter @staticforge/checker exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test the CLI
        run: |
          pnpm sforge --version
          pnpm sforge schema config --json > /dev/null
          pnpm sforge init "$RUNNER_TEMP/site" --format json
          pnpm sforge build --cwd "$RUNNER_TEMP/site"
          pnpm sforge build --cwd examples/basic-site
          pnpm sforge check --cwd "$RUNNER_TEMP/site"
          pnpm sforge check --cwd examples/basic-site --format sarif --output "$RUNNER_TEMP/check.sarif"

  iac:
    name: HCL modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: Format
        run: tofu fmt -check -recursive -diff packages/providers/aws/terraform
      - name: Module tests (mocked AWS)
        run: |
          for dir in packages/providers/aws/terraform/modules/site packages/providers/aws/terraform/state-bootstrap; do
            (cd "$dir" && tofu init -backend=false -input=false && tofu test)
          done
      - name: Validate the generated workspaces
        run: pnpm test:iac
