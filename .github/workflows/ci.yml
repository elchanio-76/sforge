name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 # version comes from packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for headless checks
        run: pnpm --filter @staticforge/checker exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test the CLI
        run: |
          pnpm sforge --version
          pnpm sforge schema config --json > /dev/null
          pnpm sforge init "$RUNNER_TEMP/site" --format json
          pnpm sforge build --cwd "$RUNNER_TEMP/site"
          pnpm sforge build --cwd examples/basic-site
          pnpm sforge check --cwd "$RUNNER_TEMP/site"
          pnpm sforge check --cwd examples/basic-site --format sarif --output "$RUNNER_TEMP/check.sarif"
      - name: Build and check the docs site (built with sforge)
        run: |
          pnpm sforge build --cwd docs
          pnpm sforge check --cwd docs --headless
      - name: Smoke test the MCP server over stdio
        run: |
          (printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 2) |
            pnpm --silent sforge mcp --cwd examples/basic-site | grep -q '"sforge_build"'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fail on high advisories that are not in audit-allowlist.json
        run: node scripts/audit-guard.mjs

  pack:
    name: Packages (installed from tarballs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:pack
      - name: Benchmark a small synthetic site (catches crashes, not regressions)
        run: pnpm bench --pages 200

  iac:
    name: HCL modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: Format
        run: tofu fmt -check -recursive -diff packages/providers/aws/terraform packages/providers/azure/terraform packages/providers/firebase/terraform packages/providers/cloudflare/terraform
      - name: Module tests (mocked clouds)
        run: |
          for dir in packages/providers/aws/terraform/modules/site packages/providers/aws/terraform/state-bootstrap packages/providers/azure/terraform/modules/site packages/providers/azure/terraform/modules/ci-oidc packages/providers/azure/terraform/state-bootstrap packages/providers/firebase/terraform/modules/site packages/providers/firebase/terraform/modules/ci-oidc packages/providers/firebase/terraform/state-bootstrap packages/providers/cloudflare/terraform/modules/records; do
            (cd "$dir" && tofu init -backend=false -input=false && tofu test)
          done
      - name: Validate the generated workspaces
        run: pnpm test:iac
